[package]
name = "dragonforge-file-vault-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false
build = "build.rs"
description = "DragonForge File Vault desktop application"

[lib]
name = "dragonforge_file_vault_app"
crate-type = ["rlib"]

[[bin]]
name = "dragonforge-file-vault"
path = "src/main.rs"

[dependencies]
dragonforge-file-vault = { path = "../../crates/dragonforge-file-vault" }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.5", features = [] }
zeroize = "1.8"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[lints]
workspace = true
