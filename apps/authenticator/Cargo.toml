[package]
name = "dragonforge-authenticator-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false
build = "build.rs"
description = "DragonForge Authenticator desktop application"

[lib]
name = "dragonforge_authenticator_app"
crate-type = ["rlib"]

[[bin]]
name = "dragonforge-authenticator"
path = "src/main.rs"

[dependencies]
dragonforge-authenticator = { path = "../../crates/dragonforge-authenticator" }
dragonforge-core = { path = "../../crates/dragonforge-core" }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.5", features = [] }
zeroize = "1.8"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[lints]
workspace = true
