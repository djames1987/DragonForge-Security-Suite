[package]
name = "dragonforge-security-center"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false
build = "build.rs"
description = "DragonForge Security Suite unified dashboard"

[lib]
name = "dragonforge_security_center"
crate-type = ["rlib"]

[[bin]]
name = "dragonforge-security-center"
path = "src/main.rs"

[dependencies]
dragonforge-agent = { path = "../../crates/dragonforge-agent" }
dragonforge-core = { path = "../../crates/dragonforge-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = [] }

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dev-dependencies]
tempfile = "3.27"

[lints]
workspace = true
