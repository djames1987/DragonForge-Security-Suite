[package]
name = "dragonforge-secure-share-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false
build = "build.rs"
description = "DragonForge Secure Share desktop application"

[lib]
name = "dragonforge_secure_share_app"
crate-type = ["rlib"]

[[bin]]
name = "dragonforge-secure-share"
path = "src/main.rs"

[dependencies]
dragonforge-secure-share = { path = "../../crates/dragonforge-secure-share" }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.5", features = [] }

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[lints]
workspace = true
