name: Feature request
description: Suggest a non-security product or documentation improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature discussion is welcome. Do not submit source patches, artwork, or other copyrightable implementation material; unsolicited code contributions are not currently accepted.
  - type: input
    id: component
    attributes:
      label: Component or area
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Desired behavior
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints or alternatives
      description: Do not include confidential or security-sensitive information.
