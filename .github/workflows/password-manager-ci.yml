name: Password Manager CI

on:
  push:
    branches: [main]
    paths:
      - "apps/password-manager/**"
      - "services/password-manager-sync/**"
      - "extensions/password-manager-browser/**"
      - "crates/dragonforge-crypto/**"
      - "crates/dragonforge-vault/**"
      - "scripts/password-manager/**"
      - ".cargo/audit.toml"
      - "Cargo.toml"
      - ".github/workflows/password-manager-ci.yml"
  pull_request:
    paths:
      - "apps/password-manager/**"
      - "services/password-manager-sync/**"
      - "extensions/password-manager-browser/**"
      - "crates/dragonforge-crypto/**"
      - "crates/dragonforge-vault/**"
      - "scripts/password-manager/**"
      - ".cargo/audit.toml"
      - "Cargo.toml"
      - ".github/workflows/password-manager-ci.yml"

permissions:
  contents: read

concurrency:
  group: dragonforge-password-manager-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Password Manager regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: JavaScript syntax
        run: |
          node --check apps/password-manager/ui/app.js
          node --check extensions/password-manager-browser/src/core.js
          node --check extensions/password-manager-browser/src/background.js
          node --check extensions/password-manager-browser/ui/popup.js
      - name: Browser extension tests
        run: node --test extensions/password-manager-browser/tests/core.test.mjs extensions/password-manager-browser/tests/manifest.test.mjs
      - name: Debug workspace tests
        run: cargo test --workspace --all-features
      - name: Phase 11 protected-sidecar test
        run: cargo test -p dragonforge-desktop --lib sync::tests::protected_v3_disk_config_omits_sync_secrets
      - name: Recovery tests
        run: |
          cargo test -p dragonforge-sync-server --test account_recovery -- --nocapture
          cargo test -p dragonforge-desktop --test account_recovery -- --nocapture --test-threads=1
      - name: Enrollment and sync tests
        run: |
          cargo test -p dragonforge-sync-server --test device_enrollment -- --nocapture
          cargo test -p dragonforge-desktop --test multi_device_sync -- --nocapture --test-threads=1
          cargo test -p dragonforge-sync-server --test sync_api -- --nocapture
      - name: Vault hardening tests
        run: cargo test -p dragonforge-vault --test hardening -- --test-threads=1
      - name: Release tests
        run: cargo test --workspace --all-features --release
      - name: Release builds
        run: |
          cargo build -p dragonforge-desktop --release --bin dragonforge-desktop
          cargo build -p dragonforge-desktop --release --bin dragonforge-native-host
          cargo build -p dragonforge-sync-server --features postgres --release

  windows-desktop:
    name: Windows Password Manager verification
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Rust
        shell: powershell
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy
      - name: Format and Clippy
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Validate PowerShell scripts
        shell: powershell
        run: |
          $files = @(
            'scripts/password-manager/install-browser-native-host.ps1',
            'scripts/password-manager/uninstall-browser-native-host.ps1',
            'scripts/password-manager/test-browser-native-host.ps1',
            'scripts/password-manager/cleanup-workspace.ps1',
            'scripts/password-manager/run-phase6-tests.ps1',
            'scripts/password-manager/run-phase7-tests.ps1',
            'scripts/password-manager/run-phase8-tests.ps1',
            'scripts/password-manager/run-phase9-tests.ps1',
            'scripts/password-manager/run-phase10-tests.ps1',
            'scripts/password-manager/run-phase11-tests.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          }
      - name: Windows regression tests
        run: |
          cargo check -p dragonforge-desktop --all-targets
          cargo check -p dragonforge-sync-server --features postgres --all-targets
          cargo test -p dragonforge-sync-server --test sync_api -- --nocapture
          cargo test -p dragonforge-desktop --test secret_storage -- --nocapture
          cargo test -p dragonforge-sync-server --test account_recovery -- --nocapture
          cargo test -p dragonforge-desktop --test account_recovery -- --nocapture
          cargo test -p dragonforge-sync-server --test device_enrollment -- --nocapture
          cargo test -p dragonforge-desktop --test multi_device_sync -- --nocapture
          cargo test -p dragonforge-desktop --test desktop_service -- --nocapture
      - name: Windows release builds
        run: |
          cargo build -p dragonforge-desktop --release --bin dragonforge-desktop
          cargo build -p dragonforge-desktop --release --bin dragonforge-native-host
          cargo build -p dragonforge-sync-server --features postgres --release
