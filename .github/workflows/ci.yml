name: Suite Application CI

on:
  push:
    branches: ["main"]
    paths:
      - "apps/security-center/**"
      - "apps/file-vault/**"
      - "apps/authenticator/**"
      - "apps/security-scanner/**"
      - "apps/integrity-monitor/**"
      - "apps/network-guard/**"
      - "apps/backup-recovery/**"
      - "apps/secure-share/**"
      - "services/dragonforge-agent/**"
      - "crates/dragonforge-core/**"
      - "crates/dragonforge-agent/**"
      - "crates/dragonforge-file-vault/**"
      - "crates/dragonforge-authenticator/**"
      - "crates/dragonforge-security-scanner/**"
      - "crates/dragonforge-integrity-monitor/**"
      - "crates/dragonforge-network-guard/**"
      - "crates/dragonforge-backup-recovery/**"
      - "crates/dragonforge-secure-share/**"
      - "scripts/run-phase3-security-center-tests.ps1"
      - "scripts/run-phase4-file-vault-tests.ps1"
      - "scripts/run-phase5-authenticator-tests.ps1"
      - "scripts/run-phase6-security-scanner-tests.ps1"
      - "scripts/run-phase7-integrity-monitor-tests.ps1"
      - "scripts/run-phase8-network-guard-tests.ps1"
      - "scripts/run-phase9-backup-recovery-tests.ps1"
      - "scripts/run-phase10-secure-share-tests.ps1"
      - "scripts/run-phase11-agent-tests.ps1"
      - "scripts/build-all-apps-for-testing.ps1"
      - "scripts/run-phase13-beta-readiness-tests.ps1"
      - "scripts/new-beta-qualification-record.ps1"
      - "docs/PHASE_13_BETA_READINESS.md"
      - "docs/BETA_QUALIFICATION_MATRIX.md"
      - "docs/BETA_RELEASE_GATE.md"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "apps/security-center/**"
      - "apps/file-vault/**"
      - "apps/authenticator/**"
      - "apps/security-scanner/**"
      - "apps/integrity-monitor/**"
      - "apps/network-guard/**"
      - "apps/backup-recovery/**"
      - "apps/secure-share/**"
      - "services/dragonforge-agent/**"
      - "crates/dragonforge-core/**"
      - "crates/dragonforge-agent/**"
      - "crates/dragonforge-file-vault/**"
      - "crates/dragonforge-authenticator/**"
      - "crates/dragonforge-security-scanner/**"
      - "crates/dragonforge-integrity-monitor/**"
      - "crates/dragonforge-network-guard/**"
      - "crates/dragonforge-backup-recovery/**"
      - "crates/dragonforge-secure-share/**"
      - "scripts/run-phase3-security-center-tests.ps1"
      - "scripts/run-phase4-file-vault-tests.ps1"
      - "scripts/run-phase5-authenticator-tests.ps1"
      - "scripts/run-phase6-security-scanner-tests.ps1"
      - "scripts/run-phase7-integrity-monitor-tests.ps1"
      - "scripts/run-phase8-network-guard-tests.ps1"
      - "scripts/run-phase9-backup-recovery-tests.ps1"
      - "scripts/run-phase10-secure-share-tests.ps1"
      - "scripts/run-phase11-agent-tests.ps1"
      - "scripts/build-all-apps-for-testing.ps1"
      - "scripts/run-phase13-beta-readiness-tests.ps1"
      - "scripts/new-beta-qualification-record.ps1"
      - "docs/PHASE_13_BETA_READINESS.md"
      - "docs/BETA_QUALIFICATION_MATRIX.md"
      - "docs/BETA_RELEASE_GATE.md"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  suite-applications:
    name: Security Center + File Vault + Authenticator + Scanner + Integrity + Network + Backup + Share + Agent
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        continue-on-error: true

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Format
        run: cargo fmt --all --check

      - name: Check suite applications
        run: cargo check -p dragonforge-core -p dragonforge-security-center -p dragonforge-file-vault -p dragonforge-file-vault-app -p dragonforge-authenticator -p dragonforge-authenticator-app -p dragonforge-security-scanner -p dragonforge-security-scanner-app -p dragonforge-integrity-monitor -p dragonforge-integrity-monitor-app -p dragonforge-network-guard -p dragonforge-network-guard-app -p dragonforge-backup-recovery -p dragonforge-backup-recovery-app -p dragonforge-secure-share -p dragonforge-secure-share-app -p dragonforge-agent -p dragonforge-agent-service --all-targets

      - name: Clippy suite applications
        run: cargo clippy -p dragonforge-core -p dragonforge-security-center -p dragonforge-file-vault -p dragonforge-file-vault-app -p dragonforge-authenticator -p dragonforge-authenticator-app -p dragonforge-security-scanner -p dragonforge-security-scanner-app -p dragonforge-integrity-monitor -p dragonforge-integrity-monitor-app -p dragonforge-network-guard -p dragonforge-network-guard-app -p dragonforge-backup-recovery -p dragonforge-backup-recovery-app -p dragonforge-secure-share -p dragonforge-secure-share-app -p dragonforge-agent -p dragonforge-agent-service --all-targets -- -D warnings

      - name: Test suite applications
        run: cargo test -p dragonforge-core -p dragonforge-agent -p dragonforge-agent-service -p dragonforge-security-center -p dragonforge-file-vault -p dragonforge-file-vault-app -p dragonforge-authenticator -p dragonforge-authenticator-app -p dragonforge-security-scanner -p dragonforge-security-scanner-app -p dragonforge-integrity-monitor -p dragonforge-integrity-monitor-app -p dragonforge-network-guard -p dragonforge-network-guard-app -p dragonforge-backup-recovery -p dragonforge-backup-recovery-app -p dragonforge-secure-share -p dragonforge-secure-share-app --all-targets

      - name: Check application JavaScript
        shell: pwsh
        run: |
          node --check apps/security-center/ui/app.js
          node --check apps/file-vault/ui/app.js
          node --check apps/authenticator/ui/app.js
          node --check apps/security-scanner/ui/app.js
          node --check apps/integrity-monitor/ui/app.js
          node --check apps/network-guard/ui/app.js
          node --check apps/backup-recovery/ui/app.js
          node --check apps/secure-share/ui/app.js

      - name: Phase 13 qualification invariants
        shell: pwsh
        run: |
          $scripts = @(
            'scripts/run-phase13-beta-readiness-tests.ps1',
            'scripts/new-beta-qualification-record.ps1'
          )
          foreach ($file in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          }
          $apps = @('security-center','password-manager','file-vault','authenticator','security-scanner','integrity-monitor','network-guard','backup-recovery','secure-share')
          foreach ($app in $apps) {
            $html = Get-Content -Raw "apps/$app/ui/index.html"
            if (-not $html.Contains('Suite Phase 13')) { throw "$app has stale suite phase metadata." }
          }
          foreach ($file in @('docs/PHASE_13_BETA_READINESS.md','docs/BETA_QUALIFICATION_MATRIX.md','docs/BETA_RELEASE_GATE.md')) {
            if (-not (Test-Path $file)) { throw "Missing Phase 13 artifact: $file" }
          }

      - name: Build all suite applications for testing
        shell: pwsh
        run: ./scripts/build-all-apps-for-testing.ps1
