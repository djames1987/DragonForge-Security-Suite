name: Suite Foundation CI

on:
  push:
    branches: ["main"]
    paths:
      - "apps/security-center/**"
      - "crates/dragonforge-core/**"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "apps/security-center/**"
      - "crates/dragonforge-core/**"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  foundation:
    name: Suite foundation
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        continue-on-error: true

      - name: Format
        run: cargo fmt --all --check

      - name: Check suite foundation
        run: cargo check -p dragonforge-core -p dragonforge-security-center --all-targets

      - name: Clippy suite foundation
        run: cargo clippy -p dragonforge-core -p dragonforge-security-center --all-targets -- -D warnings

      - name: Test suite foundation
        run: cargo test -p dragonforge-core -p dragonforge-security-center --all-targets
