permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  suite-applications:
    name: Security Center + File Vault + Authenticator + Scanner + Integrity + Network + Backup + Share + Agent
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        continue-on-error: true

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Format
        run: cargo fmt --all --check

      - name: Check suite applications
        run: cargo check -p dragonforge-desktop -p dragonforge-sync-server -p dragonforge-core -p dragonforge-update -p dragonforge-windows-boundary -p dragonforge-privileged-service -p dragonforge-security-center -p dragonforge-file-vault -p dragonforge-file-vault-app -p dragonforge-authenticator -p dragonforge-authenticator-app -p dragonforge-security-scanner -p dragonforge-security-scanner-app -p dragonforge-integrity-monitor -p dragonforge-integrity-monitor-app -p dragonforge-network-guard -p dragonforge-network-guard-app -p dragonforge-backup-recovery -p dragonforge-backup-recovery-app -p dragonforge-secure-share -p dragonforge-secure-share-app -p dragonforge-agent -p dragonforge-agent-service --all-targets

      - name: Clippy suite applications
        run: cargo clippy -p dragonforge-desktop -p dragonforge-sync-server -p dragonforge-core -p dragonforge-update -p dragonforge-windows-boundary -p dragonforge-privileged-service -p dragonforge-security-center -p dragonforge-file-vault -p dragonforge-file-vault-app -p dragonforge-authenticator -p dragonforge-authenticator-app -p dragonforge-security-scanner -p dragonforge-security-scanner-app -p dragonforge-integrity-monitor -p dragonforge-integrity-monitor-app -p dragonforge-network-guard -p dragonforge-network-guard-app -p dragonforge-backup-recovery -p dragonforge-backup-recovery-app -p dragonforge-secure-share -p dragonforge-secure-share-app -p dragonforge-agent -p dragonforge-agent-service --all-targets -- -D warnings

      - name: Test suite applications
        run: cargo test -p dragonforge-desktop -p dragonforge-sync-server -p dragonforge-core -p dragonforge-update -p dragonforge-windows-boundary -p dragonforge-privileged-service -p dragonforge-agent -p dragonforge-agent-service -p dragonforge-security-center -p dragonforge-file-vault -p dragonforge-file-vault-app -p dragonforge-authenticator -p dragonforge-authenticator-app -p dragonforge-security-scanner -p dragonforge-security-scanner-app -p dragonforge-integrity-monitor -p dragonforge-integrity-monitor-app -p dragonforge-network-guard -p dragonforge-network-guard-app -p dragonforge-backup-recovery -p dragonforge-backup-recovery-app -p dragonforge-secure-share -p dragonforge-secure-share-app --all-targets

      - name: Check application JavaScript
        shell: pwsh
        run: |
          node --check apps/security-center/ui/app.js
          node --check apps/file-vault/ui/app.js
          node --check apps/authenticator/ui/app.js
          node --check apps/security-scanner/ui/app.js
          node --check apps/integrity-monitor/ui/app.js
          node --check apps/network-guard/ui/app.js
          node --check apps/backup-recovery/ui/app.js
          node --check apps/secure-share/ui/app.js
          node --check extensions/password-manager-browser/src/core.js
          node --check extensions/password-manager-browser/src/background.js
          node --check extensions/password-manager-browser/ui/popup.js
          node --test extensions/password-manager-browser/tests/*.test.mjs

      - name: Phase 14 secure-update invariants
        shell: pwsh
        run: |
          $scripts = @(
            'scripts/run-phase13-beta-readiness-tests.ps1',
            'scripts/new-beta-qualification-record.ps1',
            'scripts/evaluate-beta-qualification.ps1',
            'scripts/run-phase14-secure-update-tests.ps1',
            'scripts/generate-signed-update-manifest.ps1',
            'scripts/publish-windows-release.ps1',
            'scripts/run-phase15-password-manager-hardening-tests.ps1',
            'scripts/run-phase16-windows-security-boundary-tests.ps1',
            'scripts/run-phase17-privileged-service-tests.ps1',
            'scripts/install-privileged-service.ps1',
            'scripts/uninstall-privileged-service.ps1',
            'scripts/test-privileged-service.ps1',
            'scripts/password-manager/backup-sync-server.ps1',
            'scripts/password-manager/restore-sync-server.ps1',
            'scripts/password-manager/package-browser-extension.ps1'
          )
          foreach ($file in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          }
          $apps = @('security-center','password-manager','file-vault','authenticator','security-scanner','integrity-monitor','network-guard','backup-recovery','secure-share')
          foreach ($app in $apps) {
            $html = Get-Content -Raw "apps/$app/ui/index.html"
            if (-not $html.Contains('Suite Phase 14')) { throw "$app has stale suite phase metadata." }
          }
          foreach ($file in @('docs/PHASE_13_BETA_READINESS.md','docs/BETA_QUALIFICATION_MATRIX.md','docs/BETA_RELEASE_GATE.md','docs/PHASE_14_SECURE_UPDATE.md','docs/PHASE_15_PASSWORD_MANAGER_HARDENING.md','docs/PHASE_16_WINDOWS_SECURITY_BOUNDARY.md','docs/PHASE_17_DRAGONFORGE_PRIVILEGED_SERVICE.md','docs/adr/0009-windows-privileged-service-boundary.md','docs/adr/0010-privileged-service-runtime.md','docs/PASSWORD_MANAGER_SYNC_COMPATIBILITY.md','crates/dragonforge-update/src/lib.rs','crates/dragonforge-windows-boundary/src/lib.rs')) {
            if (-not (Test-Path $file)) { throw "Missing release/security artifact: $file" }
          }
          $update = Get-Content -Raw 'crates/dragonforge-update/src/lib.rs'
          if (-not $update.Contains('ML-DSA-65') -or -not $update.Contains('update candidate would downgrade')) {
            throw "Phase 14 update trust invariants are missing."
          }

      - name: Build all suite applications for testing
        shell: pwsh
        run: ./scripts/build-all-apps-for-testing.ps1
