name: Security Center CI

on:
  push:
    branches: ["main"]
    paths:
      - "apps/security-center/**"
      - "crates/dragonforge-core/**"
      - "scripts/run-phase3-security-center-tests.ps1"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "apps/security-center/**"
      - "crates/dragonforge-core/**"
      - "scripts/run-phase3-security-center-tests.ps1"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  security-center:
    name: Security Center
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        continue-on-error: true

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Format
        run: cargo fmt --all --check

      - name: Check Security Center
        run: cargo check -p dragonforge-core -p dragonforge-security-center --all-targets

      - name: Clippy Security Center
        run: cargo clippy -p dragonforge-core -p dragonforge-security-center --all-targets -- -D warnings

      - name: Test Security Center
        run: cargo test -p dragonforge-core -p dragonforge-security-center --all-targets

      - name: Check dashboard JavaScript
        run: node --check apps/security-center/ui/app.js

      - name: Build Security Center
        run: cargo build -p dragonforge-security-center
