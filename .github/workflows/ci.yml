name: Suite Application CI

on:
  push:
    branches: ["main"]
    paths:
      - "apps/security-center/**"
      - "apps/file-vault/**"
      - "apps/authenticator/**"
      - "apps/security-scanner/**"
      - "apps/integrity-monitor/**"
      - "apps/network-guard/**"
      - "crates/dragonforge-core/**"
      - "crates/dragonforge-file-vault/**"
      - "crates/dragonforge-authenticator/**"
      - "crates/dragonforge-security-scanner/**"
      - "crates/dragonforge-integrity-monitor/**"
      - "crates/dragonforge-network-guard/**"
      - "scripts/run-phase3-security-center-tests.ps1"
      - "scripts/run-phase4-file-vault-tests.ps1"
      - "scripts/run-phase5-authenticator-tests.ps1"
      - "scripts/run-phase6-security-scanner-tests.ps1"
      - "scripts/run-phase7-integrity-monitor-tests.ps1"
      - "scripts/run-phase8-network-guard-tests.ps1"
      - "scripts/build-all-apps-for-testing.ps1"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "apps/security-center/**"
      - "apps/file-vault/**"
      - "apps/authenticator/**"
      - "apps/security-scanner/**"
      - "apps/integrity-monitor/**"
      - "apps/network-guard/**"
      - "crates/dragonforge-core/**"
      - "crates/dragonforge-file-vault/**"
      - "crates/dragonforge-authenticator/**"
      - "crates/dragonforge-security-scanner/**"
      - "crates/dragonforge-integrity-monitor/**"
      - "crates/dragonforge-network-guard/**"
      - "scripts/run-phase3-security-center-tests.ps1"
      - "scripts/run-phase4-file-vault-tests.ps1"
      - "scripts/run-phase5-authenticator-tests.ps1"
      - "scripts/run-phase6-security-scanner-tests.ps1"
      - "scripts/run-phase7-integrity-monitor-tests.ps1"
      - "scripts/run-phase8-network-guard-tests.ps1"
      - "scripts/build-all-apps-for-testing.ps1"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  suite-applications:
    name: Security Center + File Vault + Authenticator + Scanner + Integrity + Network
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        continue-on-error: true

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Format
        run: cargo fmt --all --check

      - name: Check suite applications
        run: cargo check -p dragonforge-core -p dragonforge-security-center -p dragonforge-file-vault -p dragonforge-file-vault-app -p dragonforge-authenticator -p dragonforge-authenticator-app -p dragonforge-security-scanner -p dragonforge-security-scanner-app -p dragonforge-integrity-monitor -p dragonforge-integrity-monitor-app -p dragonforge-network-guard -p dragonforge-network-guard-app --all-targets

      - name: Clippy suite applications
        run: cargo clippy -p dragonforge-core -p dragonforge-security-center -p dragonforge-file-vault -p dragonforge-file-vault-app -p dragonforge-authenticator -p dragonforge-authenticator-app -p dragonforge-security-scanner -p dragonforge-security-scanner-app -p dragonforge-integrity-monitor -p dragonforge-integrity-monitor-app -p dragonforge-network-guard -p dragonforge-network-guard-app --all-targets -- -D warnings

      - name: Test suite applications
        run: cargo test -p dragonforge-core -p dragonforge-security-center -p dragonforge-file-vault -p dragonforge-file-vault-app -p dragonforge-authenticator -p dragonforge-authenticator-app -p dragonforge-security-scanner -p dragonforge-security-scanner-app -p dragonforge-integrity-monitor -p dragonforge-integrity-monitor-app -p dragonforge-network-guard -p dragonforge-network-guard-app --all-targets

      - name: Check application JavaScript
        shell: pwsh
        run: |
          node --check apps/security-center/ui/app.js
          node --check apps/file-vault/ui/app.js
          node --check apps/authenticator/ui/app.js
          node --check apps/security-scanner/ui/app.js
          node --check apps/integrity-monitor/ui/app.js
          node --check apps/network-guard/ui/app.js

      - name: Build all suite applications for testing
        shell: pwsh
        run: ./scripts/build-all-apps-for-testing.ps1
