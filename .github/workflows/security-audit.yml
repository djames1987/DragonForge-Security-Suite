name: Rust dependency security audit

on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'
  push:
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/security-audit.yml'
      - 'scripts/run-license-audit.ps1'
      - 'release/phase24-audit-gate.json'
  pull_request:
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/security-audit.yml'
      - 'scripts/run-license-audit.ps1'
      - 'release/phase24-audit-gate.json'

permissions:
  contents: read

jobs:
  rustsec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/audit@v1

  license-audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Locked dependency license audit
        shell: pwsh
        run: ./scripts/run-license-audit.ps1 -OutputPath "$env:RUNNER_TEMP/dragonforge-license-inventory.json"
