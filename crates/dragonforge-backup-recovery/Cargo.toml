[package]
name = "dragonforge-backup-recovery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false
description = "Encrypted backup and recovery engine for DragonForge Security Suite"

[dependencies]
aes-gcm = "0.10.3"
argon2 = "0.5.3"
base64 = "0.23.1"
dragonforge-core = { path = "../dragonforge-core" }
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
zeroize = "1.8"

[dev-dependencies]
tempfile = "3.27"

[lints]
workspace = true
