[package]
name = "dragonforge-authenticator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false
description = "Encrypted TOTP/HOTP engine and local store for DragonForge Authenticator"

[dependencies]
aes-gcm = "0.10.3"
argon2 = "0.5.3"
data-encoding = "2.9"
hmac = "0.12"
percent-encoding = "2.3"
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
url = "2.5"
uuid = { version = "1.18", features = ["v4", "serde"] }
zeroize = "1.8"

[dev-dependencies]
tempfile = "3.27"

[lints]
workspace = true
