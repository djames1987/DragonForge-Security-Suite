[package]
name = "dragonforge-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false
description = "Authenticated local DragonForge Agent IPC and background runtime"

[dependencies]
base64 = "0.22.1"
dragonforge-core = { path = "../dragonforge-core" }
dragonforge-integrity-monitor = { path = "../dragonforge-integrity-monitor" }
dragonforge-security-scanner = { path = "../dragonforge-security-scanner" }
dragonforge-windows-boundary = { path = "../dragonforge-windows-boundary" }
hmac = "0.12.1"
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"

[dev-dependencies]
tempfile = "3.27"

[lints]
workspace = true
