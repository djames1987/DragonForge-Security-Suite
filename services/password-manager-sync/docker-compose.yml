services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: dragonforge_sync
      POSTGRES_USER: dragonforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - dragonforge_sync_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dragonforge -d dragonforge_sync"]
      interval: 5s
      timeout: 5s
      retries: 20

  sync:
    build:
      context: ../..
      dockerfile: services/password-manager-sync/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DRAGONFORGE_SYNC_BIND: 0.0.0.0:8787
      DRAGONFORGE_SYNC_DATABASE_URL: postgres://dragonforge:${POSTGRES_PASSWORD}@postgres:5432/dragonforge_sync
      DRAGONFORGE_SYNC_ADMIN_TOKEN: ${DRAGONFORGE_SYNC_ADMIN_TOKEN}
      DRAGONFORGE_SYNC_ENVIRONMENT: ${DRAGONFORGE_SYNC_ENVIRONMENT:-production}
      DRAGONFORGE_SYNC_TLS_PROXY: ${DRAGONFORGE_SYNC_TLS_PROXY:-true}
      DRAGONFORGE_SYNC_PUBLIC_BASE_URL: ${DRAGONFORGE_SYNC_PUBLIC_BASE_URL}
      DRAGONFORGE_SYNC_RATE_LIMIT_REQUESTS: ${DRAGONFORGE_SYNC_RATE_LIMIT_REQUESTS:-240}
      DRAGONFORGE_SYNC_RATE_LIMIT_WINDOW_SECONDS: ${DRAGONFORGE_SYNC_RATE_LIMIT_WINDOW_SECONDS:-60}
    ports:
      - "127.0.0.1:8787:8787"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  dragonforge_sync_postgres:
