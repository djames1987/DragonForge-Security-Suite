[package]
name = "dragonforge-privileged-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false
description = "Windows-only privileged service boundary for DragonForge Security Suite"

[[bin]]
name = "dragonforge-privileged-service"
path = "src/main.rs"

[dependencies]
dragonforge-windows-boundary = { path = "../../crates/dragonforge-windows-boundary" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["io-util", "net", "rt-multi-thread", "time"] }

[target.'cfg(windows)'.dependencies]
windows-service = "=0.8.0"
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
widestring = "=1.1.0"

# Phase 17 deliberately contains a small audited Windows FFI module for named-pipe
# peer identity, explicit pipe ACL construction, and Authenticode publisher checks.
# The rest of the workspace continues to forbid unsafe code.

[dev-dependencies]
tempfile = "3.27"
