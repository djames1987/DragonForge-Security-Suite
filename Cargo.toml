[workspace]
members = [
    "apps/security-center",
    "apps/password-manager",
    "services/password-manager-sync",
    "crates/dragonforge-core",
    "crates/dragonforge-crypto",
    "crates/dragonforge-vault",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["DragonForge Security Suite contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
