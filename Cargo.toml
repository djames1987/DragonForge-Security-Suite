[workspace]
members = [
    "apps/security-center",
    "apps/password-manager",
    "apps/file-vault",
    "apps/authenticator",
    "apps/security-scanner",
    "apps/integrity-monitor",
    "apps/network-guard",
    "apps/backup-recovery",
    "apps/secure-share",
    "services/password-manager-sync",
    "services/dragonforge-agent",
    "services/dragonforge-privileged-service",
    "crates/dragonforge-core",
    "crates/dragonforge-update",
    "crates/dragonforge-windows-boundary",
    "crates/dragonforge-agent",
    "crates/dragonforge-file-vault",
    "crates/dragonforge-authenticator",
    "crates/dragonforge-security-scanner",
    "crates/dragonforge-integrity-monitor",
    "crates/dragonforge-network-guard",
    "crates/dragonforge-backup-recovery",
    "crates/dragonforge-secure-share",
    "crates/dragonforge-crypto",
    "crates/dragonforge-vault",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["DragonForge Security Suite contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
